name: C++ and Python Tests

on:
  push:
    branches: [ main, extra_3_language_gaps ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        include:
          - os: ubuntu-latest
            cppython_rel: build/cppython
          - os: macos-latest
            cppython_rel: build/cppython
          - os: windows-latest
            cppython_rel: build/Release/cppython.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --- зависимости ---

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y qt6-base-dev qt6-tools-dev libqt6core6 qt6-l10n-tools
          sudo apt-get install -y libboost-all-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake qt boost

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        id: boost
        uses: MarkusJx/install-boost@v2
        with:
          boost_version: 1.86.0
          platform_version: 2022
          toolset: msvc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # --- сборка ---

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix boost)"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ steps.boost.outputs.BOOST_ROOT }}"
        env:
          BOOST_ROOT: ${{ steps.boost.outputs.BOOST_ROOT }}

      - name: Build
        run: cmake --build build --config Release

      # --- тесты ---

      - name: Run tests
        env:
          CPPYTHON_BIN: ${{ github.workspace }}/${{ matrix.cppython_rel }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -v
